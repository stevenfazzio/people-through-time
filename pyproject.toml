[project]
name = "people-through-time"
version = "0.1.0"
description = "A semantic map of the most famous people of every era, from all Wikipedias, with a birth-year slider"
requires-python = ">=3.11"
# Only what the code in this repo imports today. Add the embedding / UMAP /
# Toponymy stack (see living-people-map's pyproject) as those stages land.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0,<3",
    "pyarrow>=15",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "umap-learn>=0.5.12",
    "scikit-learn>=1.4",
    "anthropic>=2.6.0",
    "plotly>=7.1.0",
    "concept-erasure>=0.2.4",
    "toponymy>=0.5.4",
    "glasbey>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8",
]
publish = [
    "playwright>=1.48",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["config", "util", "embedder", "namer", "naming"]

[tool.pytest.ini_options]
testpaths = ["tests"]
